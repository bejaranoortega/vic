<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="AmorOS: un sistema operativo hecho con amor">
<meta name="theme-color" content="#1a1030">
<title>AmorOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E💓%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== VARIABLES Y TEMAS ===== */
:root{--acc:#ff5c93;--blur:30px;--ds:52px;--wb:#ffffffe6;--wt:#2b2236;--el:#fff;--cd:#ffe9f1;--hd:#ffffff80;--ln:#0001}
html.dark{--wb:#241e30ea;--wt:#f2eefa;--el:#3a3249;--cd:#41364f;--hd:#ffffff14;--ln:#fff2;color-scheme:dark}
html.noanim *{animation:none!important;transition:none!important}
html.nodots .d.run::after{display:none}
*{box-sizing:border-box;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
html,body{height:100%;overflow:hidden;background:#1a1030;color:#fff;user-select:none}
input,textarea{user-select:text}
svg{pointer-events:none}
#wall{position:fixed;inset:0;background:#1a1030 center/cover}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9990}
.hb{display:inline-block;animation:beat 1.2s infinite}
@keyframes beat{0%,100%{scale:1}14%{scale:1.3}28%{scale:1}42%{scale:1.22}}
/* ===== ERROR EN CELULAR ===== */
#err{display:none;position:fixed;inset:0;z-index:9999;place-content:center;gap:12px;text-align:center;padding:24px;background:#0a4fd1}
#err h1{font-size:5rem;font-weight:300}
body.bad #err{display:grid}
body.bad>:not(#err){display:none!important}
/* ===== BLOQUEO ===== */
/* ===== BARRA DE MENU ===== */
#menu{position:fixed;top:0;left:0;right:0;height:30px;z-index:3000;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:13.5px;background:#00000040;backdrop-filter:blur(var(--blur)) saturate(180%)}
#menu div{display:flex;align-items:center;gap:16px}
#menu a{cursor:pointer}#menu a:hover{opacity:.7}
#menu svg{width:15px;height:15px;vertical-align:-3px}
/* ===== DOCK ===== */
#dock{position:fixed;left:50%;bottom:10px;translate:-50% 0;z-index:2500;display:flex;align-items:flex-end;gap:7px;padding:8px 12px;border-radius:26px;background:#ffffff30;border:1px solid #ffffff55;backdrop-filter:blur(var(--blur)) saturate(180%);box-shadow:0 10px 40px #0004}
.d{all:unset;display:block;position:relative;width:var(--ds);height:var(--ds);cursor:pointer;transition:width .12s,height .12s}
.d span{display:grid;place-items:center;width:100%;height:100%;border-radius:23%;box-shadow:inset 0 1px 0 #fff9,0 6px 14px #0004;color:#fff;font-weight:700}
.d svg{width:54%;height:54%}
.d img{width:58%;height:58%;pointer-events:none}
.d.run::after{content:'';position:absolute;left:50%;bottom:-7px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#fff}
.d:hover::before{content:attr(data-n);position:absolute;bottom:calc(100% + 12px);left:50%;translate:-50% 0;padding:3px 10px;border-radius:8px;background:#000a;font-size:12px;white-space:nowrap}
.d.bounce{animation:bn .6s 2}
@keyframes bn{50%{transform:translateY(-22px)}}
/* ===== VENTANAS (estilo Windows) ===== */
.win{position:fixed;display:flex;flex-direction:column;min-width:300px;min-height:180px;background:var(--wb);color:var(--wt);backdrop-filter:blur(var(--blur)) saturate(180%);border-radius:10px;border:1px solid #fff5;box-shadow:0 14px 40px #0004;overflow:hidden;animation:pop .25s cubic-bezier(.2,1.2,.4,1);transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .3s,box-shadow .2s}
.win.act{box-shadow:0 24px 70px #0008}
.win.mini{transform:translate(var(--tx),var(--ty)) scale(.04);opacity:0;pointer-events:none}
.win.closing{animation:out .18s forwards}
.win.max{inset:30px 0 0 0!important;width:auto!important;height:auto!important;border-radius:0;border:0}
.win.max .body{padding-bottom:96px}
@keyframes pop{from{transform:scale(.9);opacity:0}}
@keyframes out{to{transform:scale(.92);opacity:0}}
.win header{display:flex;align-items:center;height:36px;padding-left:12px;gap:8px;background:var(--hd);border-bottom:1px solid var(--ln)}
.win header b{flex:1;font-size:13px;font-weight:500;opacity:.65;pointer-events:none}
.win.act header b{opacity:1}
.wi{width:15px;height:15px}
.wb{display:flex;height:100%}
.wb button{all:unset;display:grid;place-items:center;width:48px;height:100%;cursor:pointer}
.wb button:hover{background:#8884}
.wb [data-a=x]:hover{background:#e81123;color:#fff}
.wb svg{width:15px;height:15px}
.body{flex:1;overflow:auto;padding:16px;position:relative}
.body.col{display:flex;flex-direction:column;gap:10px}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize}
#msg{display:none;position:fixed;top:40px;left:50%;translate:-50% 0;z-index:9000;background:#000b;backdrop-filter:blur(10px);padding:9px 18px;border-radius:99px;font-size:14px}
/* ===== COMPONENTES ===== */
.big{font-size:1.8rem;text-align:center;margin:8px 0;font-weight:300}
.card{background:var(--cd);border-radius:12px;padding:12px;font-size:14px;line-height:1.5}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:99px;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc),#5b3bff 50%));color:#fff;font-weight:600;font-size:14px;cursor:pointer;margin:3px;border:0}
.btn svg{width:16px;height:16px}
.sf{display:flex;gap:8px}
.sf input,.sf select,.row input[type=text],.row input:not([type]){flex:1;padding:9px 12px;border:1px solid var(--ln);border-radius:10px;font-size:14px;outline:0;background:var(--el);color:var(--wt)}
.fr{flex:1;min-height:200px;width:100%;border:0;border-radius:10px;overflow:hidden;background:#0002}
.fr iframe{width:100%;height:100%;border:0}
.res{flex:1;overflow:auto;user-select:text}
.rs{display:block;background:var(--el);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.rs p{font-size:13px;opacity:.7;margin-top:3px}
.th{float:right;width:110px;border-radius:10px;margin:0 0 8px 10px}
.ml{display:grid;grid-template-columns:170px 1fr;gap:12px;height:100%}
.ml nav{display:flex;flex-direction:column;gap:6px;overflow:auto}
.ml nav button{display:flex;gap:8px;align-items:center;border:0;border-radius:10px;padding:10px;background:var(--el);color:var(--wt);cursor:pointer;text-align:left;font-size:13px}
.ml nav button svg{width:16px;height:16px;flex:none}
.ml nav .on{background:var(--cd);outline:2px solid var(--acc)}
.ml article,.ed{background:var(--el);border-radius:12px;padding:16px;overflow:auto;line-height:1.55}
.ed{display:flex;flex-direction:column;gap:8px;padding:10px}
.nt{flex:1;width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--wt);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
.tb{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lb{position:absolute;inset:36px 0 0;background:#000e;display:grid;place-items:center;z-index:5;color:#fff}
.lb img{max-width:96%;max-height:calc(100% - 70px);border-radius:8px}
.lbt{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:8px;font-size:13px}
.cd output{display:block;background:#2b2236;color:#fff;font-size:2rem;text-align:right;padding:14px;border-radius:12px;margin-bottom:10px;overflow:hidden}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ck button{padding:14px 0;border:0;border-radius:12px;font-size:1.1rem;background:var(--el);color:var(--wt);cursor:pointer}
.ck button:active{background:var(--cd)}
.ch{display:flex;justify-content:space-between;align-items:center;text-transform:capitalize;margin-bottom:8px}
.ch button{border:0;background:var(--el);color:var(--wt);border-radius:8px;width:32px;height:32px;cursor:pointer;display:grid;place-items:center}
.ch svg{width:16px;height:16px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:10px}
.cg i{font-style:normal;font-size:12px;opacity:.6}
.cg span{padding:8px 0;border-radius:8px;background:var(--el);cursor:pointer}
.cg .hoy{background:var(--acc);color:#fff}.cg .sel{outline:2px solid var(--acc)}
.cg .ev::after{content:'';display:block;width:5px;height:5px;margin:2px auto 0;border-radius:50%;background:var(--acc)}
.cg .hoy.ev::after{background:#fff}
.wc{background:var(--el);border-radius:14px;padding:14px;margin-bottom:10px}
.wc .t{display:flex;align-items:center;gap:14px}
.wc .t svg{width:44px;height:44px;color:var(--acc)}
.wc .t b{font-size:2.4rem;font-weight:300}
.wc .t span{margin-left:auto;text-align:right;font-size:13px;opacity:.7}
.fc{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;font-size:12px;margin-top:10px;gap:4px}
.fc svg{width:22px;height:22px;display:block;margin:4px auto;color:var(--acc)}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mg button{aspect-ratio:1;border:0;border-radius:12px;font-size:1.6rem;background:linear-gradient(135deg,var(--acc),#6a4cff);color:#fff;cursor:pointer;display:grid;place-items:center}
.mg .up{background:var(--el);color:var(--acc)}
.mg svg{width:46%;height:46%}
.disc{width:130px;height:130px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:3rem;background:conic-gradient(var(--acc),#8b6bff,var(--acc));box-shadow:0 8px 24px #0003}
.spin{animation:sp 4s linear infinite}@keyframes sp{to{rotate:360deg}}
.mu{text-align:center}
.bar{height:10px;border-radius:9px;background:#8883;margin:12px 0 4px;cursor:pointer}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--acc);pointer-events:none}
.tm{display:flex;justify-content:space-between;font-size:12px;opacity:.7}
.ctl{display:flex;justify-content:center;align-items:center;gap:10px;margin:8px 0}
.ctl button{all:unset;cursor:pointer;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--el)}
.ctl .pl{width:54px;height:54px;background:var(--acc);color:#fff}
.ctl .on{color:var(--acc);outline:2px solid var(--acc)}
.ctl svg{width:20px;height:20px}
.vol{display:flex;align-items:center;gap:8px;justify-content:center}.vol svg{width:18px}
.ql button{display:block;width:100%;text-align:left;border:0;background:var(--el);color:var(--wt);padding:8px 12px;border-radius:8px;margin-top:4px;cursor:pointer}
.ql .on{outline:2px solid var(--acc)}
.sky{background:radial-gradient(#2b1a5a,#0b0720);color:#fff}
.st{all:unset;position:absolute;cursor:pointer;color:#ffd36e}
.st svg{width:30px;height:30px;fill:#ffd36e}
.sky p{position:absolute;bottom:12px;left:14px;right:14px;text-align:center}
canvas{width:100%;border-radius:10px;background:#ffe3ee}
/* Ajustes */
.stg{display:grid;grid-template-columns:150px 1fr;gap:14px;height:100%}
.stg nav{display:flex;flex-direction:column;gap:4px}
.stg nav button{border:0;border-radius:8px;padding:10px;background:transparent;color:var(--wt);cursor:pointer;text-align:left}
.stg nav .on{background:var(--cd);font-weight:600}
.stg section{overflow:auto;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--el);padding:10px 14px;border-radius:10px;font-size:14px}
.row input[type=text]{flex:0 0 55%}
.seg button,.dot{border:0;cursor:pointer}
.seg button{padding:8px 18px;background:var(--el);color:var(--wt)}
.seg{display:flex;gap:6px}.seg button{border-radius:99px}
.seg .on{background:var(--acc);color:#fff}
.dot{width:30px;height:30px;border-radius:50%;margin:3px;border:2px solid #fff}
.wp{display:flex;flex-wrap:wrap}
.sw{all:unset;display:block;width:96px;height:60px;border-radius:10px;margin:4px;cursor:pointer;border:2px solid #fff;box-shadow:0 2px 8px #0003;object-fit:cover}
/* ===== LOOK DE CADA APP ===== */
.a-musica,.a-videos,.a-calc{--wb:#121212f4;--wt:#fff;--el:#282828;--cd:#2a2a2a;--hd:#000;--ln:#ffffff22}
.a-clima{--wb:#0f2347f2;--wt:#fff;--hd:#ffffff14;--ln:#ffffff26;--el:#ffffff1f}
.a-cartas{--acc:#d93025}.a-cal,.a-fotos{--acc:#1a73e8}.a-notas{--acc:#d99a00}.a-musica{--acc:#1db954}.a-videos{--acc:#ff0000}
.a-cartas .body,.a-notas .body,.a-musica .body,.a-videos .body,.a-calc .body,.a-fotos .body,.a-cal .body{padding:0}
.a-fotos .body,.a-cal .body{padding:12px}
.em{height:100%;display:grid;place-content:center;justify-items:center;gap:8px;opacity:.55;text-align:center}.em svg{width:48px;height:48px}
.ib{all:unset;cursor:pointer;width:30px;height:30px;display:inline-grid;place-items:center;border-radius:8px}.ib:hover{background:var(--cd)}.ib svg{width:18px}
/* Cartas (tipo Gmail) */
.gm{display:grid;grid-template-columns:300px 1fr;height:100%}
.gl{overflow:auto;border-right:1px solid var(--ln)}
.gh{padding:12px 16px;font-weight:600;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--ln)}
.gh span{margin-left:auto;font-size:12px;font-weight:400;opacity:.6}.gh svg{width:18px}
.mt{flex:1;min-width:0;display:flex;flex-direction:column}.mt em{font-style:normal;font-size:13px}
.mt small{font-size:12px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av2{flex:none;width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:600}
.gr{padding:24px 28px;overflow:auto}.gr h2{font-weight:400;margin-bottom:18px}
.gf{display:flex;gap:12px;align-items:center;margin-bottom:18px}.gf small{display:block;opacity:.6}
.gb{line-height:1.7;font-size:15px}
/* Música (tipo Spotify) */
.sp{padding:24px;min-height:100%;background:linear-gradient(#4a2370,#121212 55%)}
.spt{display:flex;gap:18px;align-items:flex-end;margin-bottom:18px}
.art{flex:none;width:140px;height:140px;border-radius:8px;display:grid;place-items:center;font-size:3.4rem;background:linear-gradient(135deg,#ff7aa8,#8b6bff);box-shadow:0 10px 30px #0008}
.spt h2{font-size:1.8rem;margin:4px 0}.spt span{opacity:.7}
.a-musica .bar i{background:#fff}.a-musica .bar:hover i{background:#1db954}
.a-musica .ctl .pl{background:#fff;color:#000}.a-musica .ctl button,.ctl label{background:transparent;color:#fff}
.ctl label{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.a-musica .ctl .on{color:#1db954;outline:0}
.sp h4{margin:18px 0 6px;opacity:.8}
.sp .ql button{display:flex;gap:10px;align-items:center;background:transparent;color:#fff;padding:10px 12px}
.sp .ql button svg{width:16px;flex:none}.sp .ql button:hover{background:#ffffff14}
.sp .ql .on{color:#1db954;background:#ffffff14;outline:0}
.sp .card{background:#2a2a2a;margin-top:8px}
/* Videos (tipo YouTube) */
/* Buscador (tipo Google) */
.gs{display:flex;flex-direction:column;gap:16px;height:100%}
.gs.home{justify-content:center;align-items:center}.gs.home .res{display:none}
.lgo{font-size:3rem;font-weight:700;letter-spacing:-1px;text-align:center;margin-bottom:14px}
.gq{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);background:var(--el);border-radius:30px;padding:0 18px;width:min(540px,100%);box-shadow:0 1px 6px #0002}
.gq svg{width:18px;opacity:.6}.gq input{flex:1;border:0;outline:0;background:transparent;color:var(--wt);padding:13px 0;font-size:15px}
.gs:not(.home) .gh2{display:flex;align-items:center;gap:18px}.gs:not(.home) .lgo{font-size:1.5rem;margin:0}.gs:not(.home) .gq{width:auto;flex:1}
.url{display:block;color:#188038;font-size:12px}.rs b{color:#1a0dab;font-weight:400;font-size:1.05rem}
html.dark .rs b{color:#8ab4f8}
/* Fotos (tipo Google Fotos) */
.mas{columns:4 150px;column-gap:6px}
.mas img{width:100%;display:block;margin-bottom:6px;border-radius:6px;break-inside:avoid;cursor:pointer}
.lb{background:#000f}
.lbh{position:absolute;top:0;left:0;right:0;display:flex;gap:12px;align-items:center;padding:8px 12px;background:linear-gradient(#000a,transparent);font-size:13px;z-index:1}
.lbh span:first-of-type{margin-right:auto}.lbh .ib{color:#fff}
.nv{all:unset;position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;background:#0008;display:grid;place-items:center;cursor:pointer;color:#fff}
.nv.l{left:10px}.nv.r{right:10px}.nv svg{width:22px}
/* Calculadora (tipo iOS) */
.ci{display:flex;flex-direction:column;height:100%;padding:14px;background:#000}
.cx{min-height:20px;text-align:right;opacity:.5;font-size:14px;padding:0 8px}
.ci output{display:block;text-align:right;font-size:3.2rem;font-weight:200;padding:4px 8px 10px;min-height:68px;overflow:hidden;background:transparent}
.ci .ck{flex:1;gap:10px;grid-auto-rows:1fr}
.ci .ck button{border-radius:999px;background:#333;color:#fff;font-size:1.4rem;padding:0}
.ci .ck .fn{background:#a5a5a5;color:#000}.ci .ck .op{background:#ff9f0a;color:#fff;font-size:1.7rem}
.ci .ck button:active{filter:brightness(1.4)}
/* Calendario (tipo Google) */
.ca{display:flex;flex-direction:column;gap:10px;height:100%}
.ch{justify-content:flex-start;gap:6px;text-transform:capitalize;margin:0;font-size:1.2rem}.ch b{margin-left:10px;font-weight:400}
.cgw{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;opacity:.6;text-transform:uppercase}.cgw i{font-style:normal}
.cgm{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;border-top:1px solid var(--ln);border-left:1px solid var(--ln);min-height:0}
.cell{border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:4px;overflow:hidden;cursor:pointer;font-size:12px}
.cell:hover{background:var(--cd)}.cell.off{background:var(--hd);cursor:default}
.cell>span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%}
.cell.hoy>span{background:var(--acc);color:#fff}.cell.sel{outline:2px solid var(--acc);outline-offset:-2px}
.cell small{display:block;margin-top:2px;padding:1px 6px;border-radius:4px;background:var(--acc);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Notas (tipo Apple Notes) */
.nb{display:grid;grid-template-columns:230px 1fr;height:100%}
.nl{overflow:auto;border-right:1px solid var(--ln);background:var(--hd)}
.nh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.nh button,.nd button{all:unset;cursor:pointer;display:grid;place-items:center;width:30px;height:30px;border-radius:8px}
.nh button:hover,.nd button:hover{background:var(--cd)}.nh svg,.nd svg{width:18px;color:var(--acc)}
.nl>button{all:unset;display:block;box-sizing:border-box;width:calc(100% - 16px);margin:2px 8px;padding:9px 12px;border-radius:10px;cursor:pointer}
.nl>button.on{background:var(--acc);color:#fff}
.nl>button b,.nl>button small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nl small{font-size:12px;opacity:.7}
.ne{display:flex;flex-direction:column;padding:12px 20px}
.nd{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.7;margin-bottom:8px}
.nz{padding:14px;opacity:.6}
/* Clima (tipo iOS) */
.cw{border-radius:18px;padding:18px;color:#fff;margin-bottom:14px;text-shadow:0 1px 6px #0003}
.a-clima .body{padding:14px}
.cwh{display:flex;justify-content:space-between}
.cwt{font-size:4.5rem;font-weight:200;line-height:1.1}
.cwc{display:flex;align-items:center;gap:8px;font-size:1.1rem;margin-bottom:4px}.cwc svg{width:22px;height:22px}
.cwf{margin-top:14px;background:#ffffff26;border-radius:12px;padding:6px 12px}
.cwf>div{display:grid;grid-template-columns:44px 26px 34px 1fr 34px;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-top:1px solid #fff3}
.cwf>div:first-child{border:0}.cwf svg{width:18px;height:18px}
.rg{height:5px;border-radius:5px;background:#0003;position:relative}

/* Ajustes (tipo Windows 11) */

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);

/* ============ 0. BLOQUEO EN CELULARES ============ */
if(matchMedia('(pointer:coarse)').matches||/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent)||innerWidth<700){
  document.body.classList.add('bad');return;
}

/* ============ 1. CONFIGURACION (edita aquí) ============ */
const CFG={
  musica:'reina.mp3', cancion:'Reina',            // mp3 en la misma carpeta que index.html
  repo:'',                                        // opcional: 'usuario/repositorio' si usas dominio propio en GitHub Pages
  lugares:[['Bogotá',4.711,-74.072],['Barranquilla',10.968,-74.781]],
  fechas:{'03-13':'Cumpleaños de Victoria','07-13':'Mi cumpleaños'},
  frases:['Hoy también pienso en ti.','Eres mi persona favorita.','Qué ganas de verte.','Gracias por existir.','Contigo todo es mejor.','Mi día mejora cuando me escribes.','Eres lo mejor que me pasó en Roblox.'],
  cartas:{
    'Cuando me extrañes':'Oye, respira xd. Yo también te extraño demasiado, pero ya falta menos. Mientras tanto mándame un audio y me alegras el día 💓',
    'Cuando tengas un mal día':'Ey princesita, hoy toca aguantar pero tranqui, yo estoy en tu equipo. Si alguien te cae mal me dices y le hacemos ghosting xd',
    'Cuando no puedas dormir':'Deja el cel y duerme, eh. Bueno, 5 minutitos más conmigo y ya xd. Que sueñes bonito, mañana te escribo temprano 💓',
    'Cuando estés aburrida':'Si estás aburrida, ábrete Roblox y me avisas. Ya no hay excusa xd',
    'Cuando dudes de ti':'Eres más brava que cualquier jefe final y encima la más bonita. Ya, repite conmigo: "soy increíble" 💓',
    'Cuando quieras reírte':'¿Qué le dice un bit a otro? "Nos vemos en el bus" xd. Sí, es malísimo, pero me quieres igual'},
  recuerdos:['Octubre 2021: nos conocimos en Roblox','Mil mensajes y los que faltan','Aunque estemos lejos, estás en mi cabeza 💓','El día que nos veamos será el mejor']
};
/* Videos de YouTube (id de video, o "list:" + id de lista). Agrega los tuyos aquí */
const VID={
  'Peppa Pig':[['list:UUrreHSUa5rnuCVDeO8dX4eA','Todos los episodios (canal oficial)'],['danJ90bO90g','Cerdita al agua'],['q9YOzk-I_Bs','La cabaña de palos más grande'],['xSD8QC7g0XY','Peppa nada con Baby Evie'],['DLPkGGJ_anI','Peppa imagina ser adulta'],['cx5In4asWhQ','El pastel perdido'],['pw4nl8t9sxw','Primer chequeo médico'],['yr-sivEm4UA','Museo de ciencias'],['hX1YqQ3TDao','Lavando el auto']],
  'Ladybug':[['list:UUlO_ni5PslPD9LsfZiyfcyA','Miraculous: todos los episodios (canal oficial)']],
  'My Little Pony':[['list:UUavwStVQoAroamzC1lPQmyg','My Little Pony: todos los videos (canal oficial)'],['cgI0rNiAxrE','My Little Pony en español: 1 hora de recopilación']]
};

/* ============ 2. UTILIDADES, AJUSTES Y ESTADO ============ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say=m=>{if(!S.toast)return;const e=$('#msg');e.textContent=m;e.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>e.style.display='none',4e3)};
const emit=n=>dispatchEvent(new Event(n));
const fs=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>say('No se pudo activar la pantalla completa'));
const D={theme:'claro',acc:'#ff5c93',blur:30,anim:1,bright:100,wall:0,rand:0,fit:'smart',wblur:0,rot:0,dock:52,zoom:1,dots:1,dpos:'b',dhide:0,name:'Victoria',avatar:'',h24:1,sec:0,vol:1,toast:1,snd:1,pin:'',idle:0,lw:1};
let S={...D};try{const o=JSON.parse(localStorage.amorS||'{}');if((o.v||0)<2)o.fit='smart';o.v=2;Object.assign(S,o)}catch{}
const save=()=>{try{localStorage.amorS=JSON.stringify(S)}catch{}};
const A=new Audio();                      // reproductor único de música
const dock=$('#dock');

/* iconos Lucide: se dibujan solos cada vez que aparece un <i data-lucide> */
let lq=0;
new MutationObserver(()=>{if(lq)return;lq=requestAnimationFrame(()=>{lq=0;window.lucide&&lucide.createIcons()})}).observe(document.body,{childList:true,subtree:true});

let BASE=52;
const isDark=()=>{const h=new Date().getHours();return S.theme=='oscuro'||(S.theme=='auto'&&(h>=19||h<6))};
function apply(){
  const r=document.documentElement,s=r.style;
  s.setProperty('--acc',S.acc);s.setProperty('--blur',S.blur+'px');s.setProperty('--ds',S.dock+'px');s.setProperty('--ds0',S.dock+'px');
  r.classList.toggle('dark',isDark());r.classList.toggle('noanim',!S.anim);r.classList.toggle('nodots',!S.dots);r.classList.toggle('dkhide',!!S.dhide);
  r.dataset.dp=S.dpos;
  $('#dim').style.opacity=1-S.bright/100;A.volume=S.vol;
  dock.querySelectorAll('.d').forEach(d=>d.style.width=d.style.height='');
  requestAnimationFrame(()=>{const d=dock.querySelector('.d');if(d&&d.offsetWidth)BASE=d.offsetWidth});
  paintWall();rotate();renderLock();clk();
}

/* ============ 3. FOTOS: carpeta "Fotos" junto a index.html ============ */
const IMG=/\.(png|jpe?g|gif|webp|avif|bmp|svg|jfif)$/i;
let PH=[],RP=null;
const nat=(a,b)=>a.n.localeCompare(b.n,undefined,{numeric:true});
function ghInfo(){      // en GitHub Pages deduce usuario/repositorio (y la subcarpeta) de la dirección
  if(CFG.repo)return{repo:CFG.repo,base:''};
  const h=location.hostname;if(!h.endsWith('.github.io'))return null;
  const o=h.split('.')[0],seg=location.pathname.split('/').filter(Boolean);
  if(seg.length&&!seg[0].includes('.')){const rest=seg.slice(1);if(rest.length&&rest[rest.length-1].includes('.'))rest.pop();return{repo:`${o}/${seg[0]}`,base:rest.join('/')}}
  return{repo:`${o}/${h}`,base:''};
}
let PHSRC='ninguna';
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
function loadList(src){      // lista.js (la crea actualizar-fotos.bat): funciona incluso abriendo el archivo con doble clic
  return new Promise(res=>{
    const t=document.createElement('script'),end=l=>{clearTimeout(tm);t.remove();res(l)},tm=setTimeout(()=>end([]),4e3);
    window.FOTOS=undefined;
    t.onload=()=>end(Array.isArray(window.FOTOS)?window.FOTOS:[]);
    t.onerror=()=>end([]);
    t.src=src+'?'+Date.now();document.head.append(t);
  });
}
async function loadPhotos(force){
  const dedupe=l=>{const s={};return l.filter(x=>!s[x.u]&&(s[x.u]=1)).sort(nat)};
  const done=(l,src)=>{PH=l;PHSRC=src;console.info('[AmorOS] Fotos:',l.length,'desde',src);return l.length};
  try{      // 1) servidor local con índice de la carpeta Fotos/ (si existe)
    const t=await(await fetch('Fotos/',{headers:{Accept:'text/html'}})).text(),base=new URL('Fotos/',location.href);
    const l=dedupe([...new DOMParser().parseFromString(t,'text/html').querySelectorAll('a[href]')].map(a=>a.getAttribute('href'))
      .filter(h=>IMG.test(decodeURIComponent(h.split('?')[0]))).map(h=>{const u=new URL(h,base);return{n:decodeURIComponent(u.pathname.split('/').pop()),u:u.href}}));
    if(l.length)return done(l,'carpeta del servidor');
  }catch{}
  const gh=ghInfo();      // 2) GitHub Pages: la API de GitHub lista los archivos junto al HTML (y Fotos/ si existe)
  if(gh){
    let c=null;try{c=JSON.parse(localStorage.amorGH||'null')}catch{}
    if(!force&&c&&Date.now()-c.t<6e5&&c.l.length)return done(c.l,'GitHub (guardado)');
    let l=[];
    for(const sub of['','Fotos','fotos']){
      if(l.length)break;
      try{const path=[gh.base,sub].filter(Boolean).join('/'),r=await fetch(`https://api.github.com/repos/${gh.repo}/contents${path?'/'+path:''}`);if(!r.ok)continue;
        const j=await r.json();if(!Array.isArray(j))continue;
        l=dedupe(j.filter(f=>f.type=='file'&&IMG.test(f.name)).map(f=>({n:f.name,u:(sub?sub+'/':'')+encodeURIComponent(f.name)})));
      }catch{}
    }
    if(l.length){try{localStorage.amorGH=JSON.stringify({t:Date.now(),l})}catch{}return done(l,'GitHub')}
    if(c&&c.l.length)return done(c.l,'GitHub (guardado)');
  }
  for(const src of['lista.js','Fotos/lista.js']){      // 3) lista.js junto al HTML
    const l=dedupe((await loadList(src)).filter(n=>typeof n=='string'&&IMG.test(n)).map(n=>({n:n.split('/').pop(),u:enc(n)})));
    if(l.length)return done(l,src);
  }
  console.info('[AmorOS] Fotos: no se encontró ninguna imagen junto al HTML');
  PH=[];PHSRC='ninguna';return 0;
}
function photosChanged(){paintLock();paintWall();emit('photos')}

/* ============ 4. FONDOS DE PANTALLA ============ */
const SV='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">';
const svg=s=>`center/cover url("data:image/svg+xml,${encodeURIComponent(s)}")`;
const lg=(id,...c)=>`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">${c.map((x,i)=>`<stop offset="${i/(c.length-1)}" stop-color="${x}"/>`).join('')}</linearGradient>`;
const stars=n=>Array.from({length:n},(_,i)=>`<circle cx="${i*337%1600}" cy="${i*191%430}" r="${1+i%3*.7}" fill="#fff" opacity="${.25+i%5*.13}"/>`).join('');
const glow='<radialGradient id="s"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>';
const sun=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r*4}" fill="url(#s)"/><circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/>`;
const mount=(a,b,c,m)=>`${SV}<defs>${lg('g',a,b,c)}${glow}</defs><rect width="1600" height="900" fill="url(#g)"/>${stars(80)}${sun(1150,440,64)}<path d="M0 640L180 520 330 610 520 470 720 620 900 540 1100 650 1300 520 1480 610 1600 560V900H0Z" fill="${m[0]}" opacity=".55"/><path d="M0 720L220 610 420 700 640 590 860 710 1080 640 1300 730 1600 620V900H0Z" fill="${m[1]}" opacity=".85"/><path d="M0 800L260 740 520 800 800 735 1100 810 1380 750 1600 800V900H0Z" fill="${m[2]}"/></svg>`;

    dock.classList.toggle('show',edge||(over&&dock.classList.contains('show')));
  }
  if(!S.zoom)return;
  const near=H?(e.clientY>r.top-30&&e.clientX>r.left-40&&e.clientX<r.right+40):(e.clientX>r.left-30&&e.clientX<r.right+30&&e.clientY>r.top-40&&e.clientY<r.bottom+40);
  dock.querySelectorAll('.d').forEach(d=>{const b=d.getBoundingClientRect(),dist=H?Math.abs(e.clientX-b.left-b.width/2):Math.abs(e.clientY-b.top-b.height/2),k=Math.max(0,1-dist/130);
    d.style.width=d.style.height=(BASE+(near?BASE*.8*k*k:0))+'px'})});

/* ============ 8. BARRA SUPERIOR, BLOQUEO Y ARRANQUE ============ */
const open1=id=>openApp(apps.find(a=>a.id==id));
$('#mf').onclick=()=>{SETTAB=1;open1('ajustes')};
$('#ms').onclick=()=>open1('buscar');
$('#mk').onclick=()=>lock();
$('#mp').onclick=fs;
function clk(){
  const d=new Date(),o={hour:'2-digit',minute:'2-digit',hour12:!S.h24};if(S.sec)o.second='2-digit';
  $('#clock').textContent=d.toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short'})+'  '+d.toLocaleTimeString('es',o);
  $('#lt').textContent=d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',hour12:!S.h24});
  $('#ld').textContent=d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
  if(S.theme=='auto')document.documentElement.classList.toggle('dark',isDark());
}

/* --- pantalla de bloqueo --- */
let WXL=null;
async function lockWeather(){
  const p=CFG.lugares[1]||CFG.lugares[0];let c=null;try{c=JSON.parse(localStorage.amorLW||'null')}catch{}
  if(c&&Date.now()-c.t<18e5){WXL=c;return}
  try{const j=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p[1]}&longitude=${p[2]}&current=temperature_2m,weather_code&timezone=auto`)).json();
    WXL={t:Date.now(),n:p[0],T:Math.round(j.current.temperature_2m),c:j.current.weather_code};
    try{localStorage.amorLW=JSON.stringify(WXL)}catch{}renderLock()}catch{}
}
function renderLock(){
  const h=new Date().getHours(),sal=h<6?'Buenas noches':h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches';
  $('#lg').textContent=`${sal}, ${S.name||'Victoria'}`;$('#un').textContent=S.name||'Victoria';
  let R=[];try{R=JSON.parse(localStorage.amorLeidas||'[]')}catch{}
  const un=Object.keys(CFG.cartas).filter(k=>!R.includes(k)).length,fr=CFG.frases[Math.floor(Date.now()/864e5)%CFG.frases.length];
  $('#lw').innerHTML=S.lw?`<div class=lc><span class=ci2><i data-lucide=mail></i></span><div><b>Cartas</b><small>${un?`Tienes ${un} carta${un>1?'s':''} de Edier sin abrir`:'Tus cartas están al día'}</small></div></div>${WXL?`<div class=lc><span class="ci2 cb"><i data-lucide="${WXI(WXL.c)}"></i></span><div><b>${esc(WXL.n)}</b><small>${WXL.T}° ahora</small></div></div>`:''}<div class=lc><span class="ci2 cf"><i data-lucide=sparkles></i></span><div><b>Mensaje del día</b><small>${esc(fr)}</small></div></div>`:'';
  const av=$('#lav'),ph=S.avatar&&PH.find(p=>p.n==S.avatar);
  if(ph){av.style.backgroundImage=`url("${ph.u}")`;av.textContent='';av.classList.remove('hb')}else{av.style.backgroundImage='';av.textContent='💓';av.classList.add('hb')}
}
const isLocked=()=>!$('#lock').classList.contains('off');
function lock(){paintLock();renderLock();$('#lock').classList.remove('off','login');$('#lp').value='';$('#le').textContent=''}
function enter(){$('#lock').classList.add('off');$('#lock').classList.remove('login');if(!PH.length)loadPhotos().then(n=>{if(n)photosChanged()})}
function unlockStart(){
  if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});   // pantalla grande
  if(S.pin){$('#lock').classList.add('login');setTimeout(()=>$('#lp').focus(),60)}else enter();
}
$('#lkm').onclick=unlockStart;
$('#lf').onsubmit=e=>{e.preventDefault();
  if($('#lp').value==S.pin)enter();
  else{$('#le').textContent='PIN incorrecto';$('#lp').value='';const f=$('#lf');f.classList.remove('bad');void f.offsetWidth;f.classList.add('bad')}};

/* --- teclado, atajos e inactividad --- */
addEventListener('keydown',e=>{
  if(isLocked()){
    const l=$('#lock');
    if(l.classList.contains('login')){if(e.key=='Escape')l.classList.remove('login');return}
    if(e.key.length==1||e.key=='Enter'){e.preventDefault();unlockStart()}
    return;
  }
  if(!e.altKey)return;
  const k=e.key.toLowerCase(),w=[...wins.values()].find(x=>x.on),btn=a=>w&&w.el.querySelector(`[data-a=${a}]`);
  if(k=='l'){e.preventDefault();lock()}
  else if(k=='w'&&w){e.preventDefault();btn('x').click()}
  else if(k=='m'&&w){e.preventDefault();btn('min').click()}
  else if(k=='enter'&&w){e.preventDefault();btn('max').click()}
});
let lastAct=Date.now();
['mousemove','keydown','mousedown'].forEach(ev=>addEventListener(ev,()=>lastAct=Date.now()));
setInterval(()=>{if(S.idle&&!isLocked()&&Date.now()-lastAct>S.idle*6e4)lock()},1e4);

setInterval(clk,1e3);
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{paintWall();paintLock()},250)});
apply();paintLock();lockWeather();
loadPhotos().then(n=>{if(n)photosChanged()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'){const n0=PH.length;loadPhotos().then(n=>{if(n!=n0)photosChanged()})}});
})();
</script>
